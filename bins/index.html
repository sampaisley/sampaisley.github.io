<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINS</title>

    <style>

        body{
            background-color: rgb(247, 245, 243);
        }
        #tab {
            font-family: monospace;
            font-size: 1.8rem;
            margin: 0 auto;
            margin-left: 30%;
            margin-top: 10rem;
            width: fit-content; 
          
        }
        span {
            padding: .5rem;
            display: inline-block;
            margin-bottom: 5px;
            color: rgb(231, 243, 8);
        }

        .ev {
            padding: .5rem;
            background-color: rgb(59, 175, 59);
            color: rgb(231, 243, 8);
        }

        .od{
            background-color: darkgray;
            color: azure;
        }

      

        .breakere{
           margin-bottom: 1.6rem;
          border-bottom: 3px solid rgb(155, 145, 145);
        }

        h1{
          color: darkgray;
          font-size: 3rem;
        }

        @media (orientation: portrait) {

            #tab {
           
            margin-left: 10%;
            margin-top: 10rem;
        }

}
    </style>
</head>

<body>


 
    <p id="tab">
      
    </p>







    <script>
      
        const tab = document.querySelector("#tab");
        tab.innerHTML = " <h1>BINS 2025</h1>";

        let start = new Date();
        let thisYear = start.getFullYear();


        let i = 0;
        let mnth;

        let modo = "blarrrrr";

        let readable;

        let monthsLeft = (12 - (start.getMonth())) * 5;




        for (let j = 0; j < monthsLeft; j++) {


            mnth = start.getMonth();

            start.setDate(start.getDate() + i);
            if (start.getFullYear() != thisYear) break;
            readable = start.toDateString().split(' ');



            if (start.getMonth() != mnth) {
                tab.innerHTML += `<section class="breakere"></section>`;
            }

            if(j % 2 == 0){
                modo = "od";
            }else{
                modo="ev";
            }
            tab.innerHTML += `<span class='${modo}'>` + readable[1] + ' - ' + readable[2] + "</span>";


            i = 7;




        } 
    </script>
</body>

</html>
