<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINS</title>

    <style>
        body {
            background-color: rgb(247, 245, 243);
        }

        #tab {
            font-family: monospace;
            border: 20px solid rgb(241, 238, 235);
            padding: .5rem;
            font-size: 1.8rem;
            /* margin: 0 auto; */
            /* margin-left: 30%; */
            margin-top: 7rem;
            /* outline: 1px solid pink;; */
            width: fit-content;

        }

        span {
            padding: .5rem 1rem;
            display: inline-block;
            margin-bottom: 5px;

        }

        .ev {

            background-color: rgb(59, 175, 59);
            color: rgb(247, 216, 80);
        }

        .od {
            background-color: rgb(90, 89, 89);
            color: azure;
        }



        .breakere {
            margin-bottom: 1.6rem;
            border-top: 3px solid rgb(155, 145, 145);
        }

        h1 {
            color: darkgray;
            font-size: 3rem;
        }

        /*        @media (orientation: portrait) {

            #tab {
           
            margin-left: 10%;
            margin-top: 10rem;
        }

} */
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">

                <p id="tab">

                </p>

            </div>
        </div>
    </div>




    <script>

        const tab = document.querySelector("#tab");
        tab.innerHTML = " <h1>BINS 2026</h1>";

        const start = new Date('02/18/2026');
      
         const end = new Date('12/20/2026');

        const now = new Date();

        let thisYear = start.getFullYear();


        let i = 0;
        let mnth;

        let modo = "";

        let readable;

        let monthsLeft = (12 - (start.getMonth())) * 5;




        for (let j = 0; j < monthsLeft; j++) {


            mnth = start.getMonth();

            (start.setDate(start.getDate() + i));


            if (start.getFullYear() != thisYear) break;
            readable = start.toDateString().split(' ');



            if (start.getMonth() != mnth && start > now) {
                tab.innerHTML += `<section class="breakere"></section>`;
            }

            if (j % 2 == 0) {
                modo = "od";
            } else {
                modo = "ev";
            }
            if (start > now && start < end) { tab.innerHTML += `<span class='${modo}'>` + readable[1] + ':' + readable[2] + "</span>"; 
        }


            i = 7;




        } 
    </script>
</body>

</html>
